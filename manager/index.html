<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="theme-color" content="#ffffff" />
  <link rel="manifest" href="../manifest.json" />
  <link rel="stylesheet" href="../styles.css" />
  <link rel="stylesheet" href="../shared.css" />
  <title>Thai Boran Manager</title>

  <style>
    .tableWrap { margin-top: 12px; overflow: auto; }
    .wideTable { min-width: 1800px; }

    /* Sales price table: small fixed box */
    .priceWrap { max-height: 260px; overflow: auto; }
    .tapHint { font-size: 12px; opacity: 0.85; margin-top: 6px; }
    .kv { width: 100%; border-collapse: collapse; }
    .kv td { padding: 6px 8px; border-bottom: 1px solid rgba(255,255,255,0.15); vertical-align: top; }
    .imgBox img { width: 100%; max-height: 420px; object-fit: contain; background: #fff; border-radius: 12px; }
    .twoCol { display: grid; grid-template-columns: 1fr; gap: 12px; }
    @media (min-width: 900px) { .twoCol { grid-template-columns: 1fr 1fr; } }
    .pinRow { display: flex; gap: 10px; align-items: center; }
    .pinRow input { font-size: 22px; letter-spacing: 6px; text-align: center; }

        /* Sales filters: force equal sizing (iPad Safari overrides otherwise) */
    #salesYear, #salesMonth, #salesDay, #salesFrom, #salesTo {
      width: 220px !important;
      box-sizing: border-box !important;
    }

.hidden { display: none !important; }
#detailModal .modal-head{
  position: sticky;
  top: 0;
  z-index: 10;
  background: inherit;
}
#detailModal .modal-body{
  max-height: 75vh;
  overflow: auto;
}
/* Printing a WAIVER DETAIL blanks the rest of the page. Scoped to the class
   the Print button sets: without that scope it also blanked the back-office
   documents, so the Print button on a report produced empty paper. */
@media print {
  body {
    background: #fff;
  }

  /* Hide everything */
  body.print-detail * {
    visibility: hidden !important;
  }

  /* Show only the submission detail modal */
  body.print-detail #detailModal,
  body.print-detail #detailModal * {
    visibility: visible !important;
  }

  /* Remove modal positioning and shadows */
  body.print-detail #detailModal {
    position: static !important;
  }

  .modal-card {
    box-shadow: none !important;
    border: none !important;
  }

  /* Printing a back-office document: nothing else is on this page now. */
}

/* Sales filters: keep year, month, day exactly same width */
.salesFilter { width: 240px; }
.salesFilter input { width: 100%; box-sizing: border-box; }

  </style>
</head>

<body>
  <main>
    <div id="offlineHint" class="notice hidden"></div>

    <!-- Server back office: tasks awaiting approval, sessions, documents,
         approve with signature. Online-first (shows an offline state). -->
    <div id="backoffice" class="bo"></div>

  </main>

  <script src="../config.js"></script>
  <script src="../shared.js"></script>
  <script src="../update.js"></script>
  <script src="../sync.js"></script>
  <script src="../printdoc.js"></script>
  <script src="../docfit.js"></script>
  <script src="../sigpad.js"></script>
  <script src="../idlelock.js"></script>
  <script src="../backoffice.js"></script>
  <script>
    TB.injectNav('manager');
    TBSync.init();
    TB.refreshPrices(); // keep this device's shared-price cache current
    TBBackoffice.init({ managerMode: true, mount: document.getElementById('backoffice'), logoSrc: '../assets/thai_boran_logo.png' });
    TBUpdate.init({ swUrl: "../sw.js" });
  </script>
</body>
</html>
