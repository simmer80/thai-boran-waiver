<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="theme-color" content="#ffffff" />
  <link rel="manifest" href="../manifest.json" />
  <link rel="stylesheet" href="../styles.css" />
  <link rel="stylesheet" href="../shared.css" />
  <title>Thai Boran — Receptionist</title>
</head>
<body>
  <main class="bo">
    <div id="offlineHint" class="notice hidden"></div>

    <!-- Server-backed back office (online-first) -->
    <div id="backoffice"></div>
  </main>

  <script src="../config.js"></script>
  <script src="../shared.js"></script>
  <script src="../sync.js"></script>
  <script src="../printdoc.js"></script>
  <script src="../docfit.js"></script>
  <script src="../sigpad.js"></script>
  <script src="../idlelock.js"></script>
  <script src="../backoffice.js"></script>
  <script src="./reception.js"></script>
  <script>
    TB.injectNav('reception');
    TBSync.init();
    TB.refreshPrices(); // keep this device's shared-price cache current
    TBReception.init();
    TBBackoffice.init({ managerMode: false, mount: document.getElementById('backoffice'), logoSrc: '../assets/thai_boran_logo.png' });
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('../sw.js');
    }
  </script>
</body>
</html>
